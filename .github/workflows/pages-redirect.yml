# The old address (matanravitsky-crypto.github.io/assignment-checker) still served the demo site with fake data.
# The site lives on Vercel now, so GitHub Pages only forwards there (pages-redirect/).
name: Forward the old GitHub Pages address

on:
  push:
    branches: [main]
    paths: ["pages-redirect/**", ".github/workflows/pages-redirect.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
