<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>בודק העבודות</title>
  <meta name="description" content="לוח הבקרה של מערכת הבדיקה האוטומטית: משיכת הגשות ממודל לתיקיית OneDrive של הקורס, בדיקה וציון עם Claude, והחזרה למודל.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Frank+Ruhl+Libre:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232340A8'/%3E%3Cpath d='M9 17l5 5 9-12' stroke='%23fff' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip" href="#main">דלג לתוכן</a>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="ניווט ראשי">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M8 17l5 5 11-13" /></svg>
        </span>
        <span class="brand-text">
          <strong>בודק העבודות</strong>
          <small>בדיקה אוטומטית של תרגילי בית</small>
        </span>
      </div>

      <nav class="nav">
        <a href="#/" data-route="/">
          <svg viewBox="0 0 24 24"><path d="M4 13h5v7H4zM10 4h5v16h-5zM16 9h4v11h-4z"/></svg>
          לוח בקרה
        </a>

        <p class="nav-group">מסלול הבדיקה</p>
        <a href="#/pull" data-route="/pull" class="nav-stage" data-stage="pull">
          <span class="nav-step"><span>1</span></span>
          משיכת הגשות
          <span class="nav-badge"></span>
        </a>
        <a href="#/grade" data-route="/grade" class="nav-stage" data-stage="grade">
          <span class="nav-step"><span>2</span></span>
          בדיקה וציון
          <span class="nav-badge"></span>
        </a>
        <a href="#/return" data-route="/return" class="nav-stage" data-stage="ret">
          <span class="nav-step"><span>3</span></span>
          החזרה לאוניברסיטה
          <span class="nav-badge"></span>
        </a>

        <p class="nav-group">מערכת</p>
        <a href="#/runs" data-route="/runs">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>
          יומן ריצות
        </a>
        <a href="#/settings" data-route="/settings">
          <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
          חיבורים והגדרות
        </a>
      </nav>

      <div class="sidebar-foot">
        <a class="conn" href="#/settings" id="conn-moodle">
          <span class="dot warn"></span>
          <span>מודל</span>
          <em>לא מחובר</em>
        </a>
        <a class="conn" href="#/settings" id="conn-claude">
          <span class="dot warn"></span>
          <span>Claude</span>
          <em>לא מחובר</em>
        </a>
        <a class="conn" href="#/settings" id="conn-drive">
          <span class="dot warn"></span>
          <span>OneDrive</span>
          <em>לא מחובר</em>
        </a>
        <p class="proto-note" id="proto-note">מצב הדגמה: הנתונים והפעולות במסך מדומים, עד שיחוברו המפתחות.</p>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="פתח תפריט">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>

        <div class="pickers">
          <label class="picker">
            <span class="sr">קורס</span>
            <select id="course-select"></select>
          </label>
          <label class="picker">
            <span class="sr">מטלה</span>
            <select id="assignment-select"></select>
          </label>
        </div>

        <div class="top-actions">
          <span class="demo-badge" id="mode-badge">מצב הדגמה</span>
          <button class="btn ghost" id="theme-btn" aria-label="החלף ערכת צבעים">
            <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          </button>
        </div>
      </header>

      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="עבודה מסומנת"></aside>
  <div class="toast-wrap" id="toasts" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script src="data.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
